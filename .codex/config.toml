[mcp_servers.chrome-devtools]
command = "npx"
args = [
    "-y",
    "chrome-devtools-mcp@latest",
]

[mcp_servers.context7]
command = "npx"
args = [
    "-y",
    "@upstash/context7-mcp@latest",
]

[mcp_servers.context7.env]
CONTEXT7_API_KEY = "<your-context7-api-key>"

[mcp_servers.docker]
command = "npx"
args = [
    "-y",
    "@swartdraak/docker-mcp-server",
]

[mcp_servers.elasticsearch-mcp-server]
command = "docker"
args = [
    "run",
    "-i",
    "--rm",
    "-e",
    "ES_URL",
    "-e",
    "ES_API_KEY",
    "docker.elastic.co/mcp/elasticsearch",
    "stdio",
]

[mcp_servers.elasticsearch-mcp-server.env]
ES_URL = "<elasticsearch-cluster-url>"
ES_API_KEY = "<elasticsearch-API-key>"

[mcp_servers.everything]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-everything",
]

[mcp_servers.fetch]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-fetch",
]

[mcp_servers.filesystem]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-filesystem",
    "/path/to/allowed/files",
]

[mcp_servers.generative-ui]
command = "npx"
args = [
    "-y",
    "generative-ui-mcp",
]

[mcp_servers.memory]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-memory",
]

[mcp_servers.n8n-mcp]
command = "npx"
args = [
    "-y",
    "n8n-mcp",
]

[mcp_servers.n8n-mcp.env]
MCP_MODE = "stdio"

[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@latest",
]

[mcp_servers.postgres]
command = "npx"
args = [
    "-y",
    "postgres-mcp-readonly",
]

[mcp_servers.postgres.env]
DATABASE_URL = "postgresql://kanvasuser:changeme_in_production@localhost:5434/filistindb"

[mcp_servers.postgresql]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-postgres",
]

[mcp_servers.postgresql.env]
POSTGRES_CONNECTION_STRING = "postgresql://user:password@localhost:5432/dbname"

[mcp_servers.redis]
command = "npx"
args = [
    "-y",
    "mcp-redis",
]

[mcp_servers.sequential-thinking]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-sequential-thinking",
]

[mcp_servers.shadcn-ui]
command = "npx"
args = [
    "-y",
    "@jpisnice/shadcn-ui-mcp-server",
]

[mcp_servers.tinyfish]
url = "https://agent.tinyfish.ai/mcp"

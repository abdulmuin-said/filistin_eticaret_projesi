
services:
  # ==========================================
  # Web Uygulaması (Veritabanı sunucunun yerel PostgreSQL servisinde çalışmaktadır)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filistinproje-web
    restart: unless-stopped
    ports:
      - "80:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DATA_PROTECTION_KEYS_PATH=/app/secure-storage/dataprotection-keys
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5434;Database=${POSTGRES_DB:-filistindb};Username=${POSTGRES_USER:-kanvasuser};Password=${POSTGRES_PASSWORD:-changeme_in_production}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - EmailSettings__Host=${EMAIL_HOST:-host.docker.internal}
      - EmailSettings__Enabled=${EMAIL_ENABLED:-false}
      - EmailSettings__TestMode=${EMAIL_TEST_MODE:-false}
      - EmailSettings__Port=${EMAIL_PORT:-587}
      - EmailSettings__EnableSSL=${EMAIL_ENABLE_SSL:-true}
      - EmailSettings__Username=${EMAIL_USERNAME:-}
      - EmailSettings__Password=${EMAIL_PASSWORD:-}
      - EmailSettings__FromEmail=${EMAIL_FROM_EMAIL:-}
      - EmailSettings__FromName=${EMAIL_FROM_NAME:-7ANRPS48}
    volumes:
      - filistin_app_uploads:/app/wwwroot/img/products
      - filistin_app_media:/app/wwwroot/media/products
      - filistin_app_logs:/app/logs
      - filistin_app_data:/app/App_Data
      - filistin_app_secure_storage:/app/secure-storage
      - filistin_app_wwwroot_uploads:/app/wwwroot/uploads

volumes:
  filistin_app_uploads:
    driver: local
  filistin_app_media:
    driver: local
  filistin_app_logs:
    driver: local
  filistin_app_data:
    driver: local
  filistin_app_secure_storage:
    driver: local
  filistin_app_wwwroot_uploads:
    driver: local
